[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rent-receipt-bot"
version = "0.1.0"
description = "Discord bot that records rent payments and emails PDF receipts to the tenant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4,<3",
    "fpdf2>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pypdf>=4",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
rent-receipt-bot = "rent_receipt.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["fpdf", "fpdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
